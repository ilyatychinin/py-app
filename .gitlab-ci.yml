workflow:
  rules:
    # Всегда запускать для MR
    - if: '$CI_MERGE_REQUEST_IID'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

variables:
  OWNER_NAME: Ilya Tychinin
  CICD_VERSION: v1.0
  LOG_FILE_NAME: log.txt
  LOG_TESTS_FILE_NAME: log-tests.txt
  LOG_DEPLOY_FILE_NAME: log-deploy.txt
stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy

before_script:
  - echo "Начинаю выполнение пайплайна"

after_script:
  - echo "Пайплайн успешно завершен"


build-job:
  tags:
    - shell      
  stage: build
  image: docker:20-dind
  script:
      - ls -la 
      - echo "Собираем образ для бота"
      - docker image build -t py-app-bot:v1-CI -f Dockerfile.bot .

      - echo "Собираем образ для прокси-сервера"
      - docker image build -t py-app-proxy:v1-CI -f Dockerfile.nginx .

      - echo "Собираем образ для бекенда"
      - docker image build -t py-app-app:v1-CI -f Dockerfile.dev .

      - echo "Собираем образ для контейнера с тестами"
      - docker image build -t py-app-tests:v1-CI -f Dockerfile.tests .
      
      - echo "Пуллим образ db"
      - docker image pull postgres:18
      - docker images


test-job:   # This job runs in the test stage.
  stage: test    # It only starts when the job in the build stage completes successfully.
  script:
      - echo "Проверяю наличие всех images"
      - docker images

      - echo "Убиваем старые попытки"
      - docker compose down -v || echo "Контейнеры не были запущены"
      - pkill -f "docker-proxy.*5000" || echo "Процесс не найден, продолжаем"
      - pkill -f "docker-proxy.*5432" || echo "Процесс не найден, продолжаем"
      - pkill -f "docker-proxy.*8080" || echo "Процесс не найден, продолжаем"
      - pkill -f "docker-proxy.*5001" || echo "Процесс не найден, продолжаем"

      - echo "Запускаем приложение"
      - docker compose up -d postgres app bot nginx
      - sleep 5

      - echo "Проверяю запустились ли все нужные сервисы"
      - docker compose ps -a

      - echo "Для лога смотрю сеть приложения"
      - apk add jq
      - docker container inspect py-app | jq '.[0].NetworkSettings.Networks' >> log.txt
      - cat log.txt

      - echo "Запускаю тесты"
      - docker container run -d --name testing-py-app -p 5001:5001 --network=py-app_default py-app-tests:v1-CI
      - sleep 7
      - docker container logs testing-py-app >> log-tests.txt
      - cat log-tests.txt

      - echo "Убираем мусор за собой"
      - docker container kill testing-py-app || echo "Контейнер уже завершен"
      - docker container rm testing-py-app 
      - docker compose down -v
      




deploy-job:      # This job runs in the deploy stage.
 stage: deploy  
 environment: staging
 script:
  - echo "Настраиваем окружение для подключения"
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  # Декодируем ключ из base64
  - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
  - chmod 600 ~/.ssh/id_ed25519

  - echo -e "Host gitlab\n\tHostName gitlab\n\tUser ilyatychinin\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null" > ~/.ssh/config
  - chmod 600 ~/.ssh/config
  # Тестируем подключение
  - echo "Тестируем SSH подключение..."
  - ssh ilyatychinin@gitlab "echo 'SSH подключение успешно!'"

  - echo "Подключаемся на сервер для деплоя"
  - ssh ilyatychinin@gitlab

  - echo "Переходим в репозиторий"
  - cd workdir/py-app
  - ls -la

  - echo "Git источник правды - берем актуальный код от туда"
  - git pull origin main
  - sleep 5

  - echo "...=====Deploying app=====..."
  - docker compose up -d postgres app bot nginx

  - sleep 15

  - echo "Проверяем запустилось ли приложение"
  - docker compose ps -a 

  - echo "Сохраняем логи"
  - docker compose logs >> log-deploy.txt
  
  - echo "Выводим логи приложения"
  - cat log-deploy.txt

